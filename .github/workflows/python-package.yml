name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            toxenv: py310
          - python: "3.11"
            toxenv: py311
          - python: "3.12"
            toxenv: py312
          - python: "3.13"
            toxenv: py313
          - python: "3.14"
            toxenv: py314
          - python: "3.15"
            toxenv: py315
            prerelease: true

    env:
      TOX_ENV: ${{ matrix.toxenv }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.prerelease == true }}
      - name: Test on the runner
        run: |
          python -m pip install 'tox>=4'
          python -m tox run -e "$TOX_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.toxenv }}
          path: .tox/${{ matrix.toxenv }}/tmp/htmlcov
          if-no-files-found: error
