[metadata]
name = insecure_but_secure_enough
version = attr: insecure_but_secure_enough.__VERSION__
description = Lightweight tools for signing and encrypting cookies, urls and stuff. This package isn't really secure, but it is secure enough for most needs.
long_description = file: README.md
long_description_content_type = text/markdown
keywords = web pylons pyramid
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
url = https://github.com/jvanasco/insecure_but_secure_enough
license = MIT
classifiers =
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15

[options]
python_requires = >=3.10
package_dir =
    = src
packages = find:
include_package_data = True
zip_safe = False
install_requires =
    cryptography>=48

[options.packages.find]
where = src

[options.package_data]
insecure_but_secure_enough = py.typed

[options.extras_require]
testing = pytest

[tox:tox]
env_list = py3{10,11,12,13,14,15}

[testenv]
package = wheel
extras = testing
deps = coverage
commands =
    python --version
    coverage run --source=insecure_but_secure_enough -m pytest {posargs}
    coverage report
    coverage html -d {envtmpdir}/htmlcov
set_env =
    COVERAGE_FILE = {envtmpdir}/.coverage

[tool:pytest]
addopts= --tb native -v -r fxX
python_files=tests/*test_*.py

[flake8]
import_order_style = appnexus
application-import-names = insecure_but_secure_enough
# E501 line too long (80 > 79 characters)
# W503 line break before binary operator
ignore = E501,W503
